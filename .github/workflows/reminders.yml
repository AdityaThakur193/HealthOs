name: Meal Reminders

# Calls the reminder endpoint, which checks which users are due a reminder.
# This repository is no longer maintained, so the job only runs manually here.
# To send reminders automatically in your fork, add this under "on:":
#   schedule:
#     - cron: "*/15 * * * *"
# GitHub may run a schedule a few minutes late, so reminders start an hour
# before a meal closes.
on:
  workflow_dispatch:
    inputs:
      send_test:
        description: Send a test notification to every device now
        type: boolean
        default: false

permissions: {}

jobs:
  send:
    name: Send Due Reminders
    if: ${{ vars.APP_URL != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Call the reminder endpoint
        env:
          APP_URL: ${{ vars.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SEND_TEST: ${{ inputs.send_test }}
        run: |
          query=""
          if [ "$SEND_TEST" = "true" ]; then query="?test=1"; fi
          curl --fail --silent --show-error --max-time 60 -X POST -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/reminders$query"
